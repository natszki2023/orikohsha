<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title><!-- YYYY-MM-DD — 記事タイトル --></title>
  <meta name="description" content="<!-- 記事の短い説明 -->">
  <link rel="canonical" href="">
</head>
<body>
  <!--
    記事テンプレート
    使い方:
    1) このファイルをコピーしてファイル名を `YYYY-MM-DD-your-slug.html` の形式に変更
    2) <title> と <meta> を編集
    3) 画像はワークスペースの images/ に置く
    4) トップページの `.journal-grid` にカードを追加してこの記事へリンク
  -->

  <article>
    <header>
      <time datetime="YYYY-MM-DD">YYYY.MM.DD</time>
      <h1>記事タイトル</h1>
    </header>

    <figure>
      <img src="../images/your-image.webp" alt="">
      <figcaption>キャプション（任意）</figcaption>
    </figure>

    <section>
      <p>本文をここに記述します。</p>
    </section>

    <footer>
      <p><a href="../index.html#journal">Journal一覧に戻る</a></p>
    </footer>
  </article>
</body>
</html>
